[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitsopay"
dynamic = ["version"]
description = "Dynamic UPI QR codes and tamper-proof payment links from a UPI ID and amount. Zero-gateway, merchant-verified payments."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bitsophia" }]
maintainers = [{ name = "Bitsophia" }]
keywords = [
    "upi", "qr", "qr-code", "payments", "india", "payment-link",
    "bhim", "gpay", "phonepe", "paytm", "fintech", "wsgi", "bitsophia",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Typing :: Typed",
]
dependencies = ["segno>=1.6,<2"]

[project.optional-dependencies]
server = ["gunicorn>=22"]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
bitsopay = "bitsopay.cli:main"

[project.urls]
Homepage = "https://github.com/Sudharsansm/Bitsopay"
Documentation = "https://github.com/Sudharsansm/Bitsopay/tree/main/docs"
Repository = "https://github.com/Sudharsansm/Bitsopay"
Issues = "https://github.com/Sudharsansm/Bitsopay/issues"
Changelog = "https://github.com/Sudharsansm/Bitsopay/blob/main/CHANGELOG.md"
Security = "https://github.com/Sudharsansm/Bitsopay/security/policy"

[tool.setuptools.dynamic]
version = { attr = "bitsopay.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bitsopay = ["py.typed"]

# --- tooling ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["bitsopay"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 92
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT"]
ignore = [
    "UP006", "UP007", "UP035", "UP045",   # keep typing.Optional/List: the package supports Python 3.9
    "S101",                               # assert is fine in tests
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"src/bitsopay/page.py" = ["E501"]  # inline CSS/HTML templates
"tests/*" = ["S", "RUF012", "B011", "PT018", "E501", "SIM117", "RUF005", "RUF015", "B905", "PT011", "PT012"]

[tool.mypy]
strict = true
files = ["src"]
