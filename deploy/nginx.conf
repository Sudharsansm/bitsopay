# Place in /etc/nginx/conf.d/bitsopay.conf (TLS certs e.g. from certbot)
limit_req_zone $binary_remote_addr zone=bitsopay_api:10m rate=10r/s;

server {
    listen 80;
    server_name pay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pay.example.com;
    ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;

    client_max_body_size 16k;

    location /api/ {
        limit_req zone=bitsopay_api burst=20 nodelay;
        include /etc/nginx/snippets/bitsopay-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/bitsopay-proxy.conf;
    }
}

